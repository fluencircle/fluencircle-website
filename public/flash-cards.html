<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Fluency — Flash Cards</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo" id="logo">
            <span>&lt;</span><span class="innerLogo">Fluency</span><span>/&gt;</span>
        </div>
        <div class="header-actions">
            <span class="user-email" id="user-email"></span>
            <button id="logout-btn" class="logout-btn" title="Sair">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sair</span>
            </button>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Criar reunião</span>
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-play"></i>
                        <span>Iniciar reunião</span>
                    </a>
                </li>
                <li class="active">
                    <a href="flash-cards.html">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Flash Cards</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <div id="meetings-content" class="content">
            <div class="page-header">
                <h2>Flash Cards</h2>
                <p>Selecione uma reunião para estudar</p>
            </div>
            <div class="classes-grid"></div>
        </div>

        <div id="flash-cards-content" class="content hidden">
            <div class="back-to-meetings back-button">
                <i class="fa-solid fa-circle-chevron-left"></i>
                <span>Voltar às reuniões</span>
            </div>
            <div class="title">
                <h1>Meeting Title</h1>
                <button id="play-cards-btn" title="Modo estudo">
                    <i class="fa-solid fa-circle-play"></i>
                </button>
            </div>
            <div class="flash-cards-grid">
                <div class="flash-card"></div>
            </div>
            <div class="flash-cards-full hidden">
                <span id="left-arrow"><i class="fa-solid fa-angle-left"></i></span>
                <span id="right-arrow"><i class="fa-solid fa-angle-right"></i></span>
                <div class="flash-card" id="full-card">
                    <span class="flash-card-front"></span>
                    <span class="flash-card-back"></span>
                </div>
            </div>
        </div>
    </main>

    <div class="loading-gif hidden">
        <div class="circle one"></div>
        <div class="circle two"></div>
        <div class="circle three"></div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/cards.js"></script>
</body>
</html>
