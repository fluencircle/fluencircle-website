<!DOCTYPE html>

    <nav class="sidebar-nav">
        <ul>

                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

            <li>

            </li>
            <li>

     <div class="loading-gif">

  <div id="meetings-content" class="content">                   

                          <div class="title">
                        <h1>Select meeting</h1>
                    </div>
            <div class="classes-grid">

            </div>
        </div>

                <div id="flash-cards-content" class="content hidden">

                    </div>

                    </div>
            <div class="flash-cards-grid">

                </div>
            </div>

                <div class="flash-card" id="full-card">

                </div>
            </div>
        </div>

        </main>
       


        <script type="module" src="app.js"></script>
