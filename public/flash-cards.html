<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle | Flash Cards</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/components/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/flashcards.page.js"></script>
</head>
<body data-shell="app" data-page="flash-cards">
    <main>
        <!-- Tela 1: decks de flashcards, um por sessão -->
        <div id="meetings-content" class="content content--wide">
            <div class="page-header">
                <div class="page-header__title-row">
                    <h2>FlashCards</h2>
                </div>
                <p id="flashcards-subtitle">
                    Revise os flashcards das suas sessões e fortaleça seu vocabulário
                </p>
            </div>

            <div class="classes-grid" id="sessions-grid" aria-live="polite">
                <!-- Preenchido por js/pages/flashcards.page.js -->
            </div>
        </div>

        <!-- Tela 2: modo de estudo com a pilha 3D (js/ui/card-stack.js) -->
        <div id="flash-cards-content" class="content hidden">
            <button type="button" class="back-to-meetings back-button" id="back-to-meetings-btn">
                <i class="fa-solid fa-circle-chevron-left" aria-hidden="true"></i>
                <span>Voltar às sessões</span>
            </button>

            <div class="page-header">
                <h2 id="current-meeting-title">Tema da Sessão</h2>
                <p id="study-instruction-text">Clique no cartão para virar e ver a resposta</p>
            </div>

            <div class="flash-cards-study-content">
                <div class="flash-card-actions">
                    <button type="button" id="previousCard" class="cards-action-btn" title="Voltar cartão anterior" aria-label="Voltar cartão anterior">
                        <i class="fa-solid fa-reply" aria-hidden="true"></i>
                    </button>
                    <button type="button" id="restart-cards-btn" class="cards-action-btn" title="Reiniciar pilha" aria-label="Reiniciar pilha">
                        <i class="fa-solid fa-arrow-rotate-left" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div id="flash-cards-container"></div>
            <div id="progress-bar" aria-hidden="true"></div>
        </div>
    </main>
</body>
</html>
