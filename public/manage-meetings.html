<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle | Sessões</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/components/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/sessions.page.js"></script>
</head>
<body data-shell="app" data-page="manage-meetings">
    <main id="manage-meetings-page">
        <!-- Visão 1: histórico de sessões -->
        <div class="content management-content" id="meetings-list-view">
            <div class="page-header">
                <h2>Sessões</h2>
                <p>Selecione uma sessão para editar o tema, perguntas ou revisar e ajustar os flashcards gerados.</p>
            </div>

            <div class="classes-grid" id="manage-meetings-grid" aria-live="polite">
                <!-- Preenchido por js/pages/sessions.page.js -->
            </div>
        </div>

        <!-- Visão 2: flashcards da sessão selecionada -->
        <div class="content management-content hidden" id="flashcards-editor-view">
            <button type="button" class="back-button" id="back-to-meetings-list-btn">
                <i class="fa-solid fa-circle-chevron-left" aria-hidden="true"></i>
                <span>Voltar às Sessões</span>
            </button>

            <div class="page-header">
                <h2 id="selected-meeting-title">Tema da Sessão</h2>
                <p>Edite os termos em inglês, as traduções ou remova cartões com erros.</p>
            </div>

            <!-- Novo flashcard manual -->
            <div class="add-card-manual-bar">
                <input type="text" id="new-card-front" placeholder="Frente" aria-label="Frente do novo card" autocomplete="off">
                <input type="text" id="new-card-back" placeholder="Verso" aria-label="Verso do novo card" autocomplete="off">
                <button type="button" id="add-new-card-btn" class="home-btn home-btn--auto">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> Adicionar Card
                </button>
            </div>

            <div class="cards-editor-container" id="cards-editor-container" aria-live="polite">
                <!-- Linhas editáveis inseridas por js/pages/sessions.page.js -->
            </div>

            <button type="button" id="delete-session-btn" class="delete-session-btn back-button">
                <i class="fa-solid fa-trash" aria-hidden="true"></i> <span>Excluir Sessão</span>
            </button>
        </div>
    </main>

    <div class="not-available-message">
        <h2>Não disponível</h2>
        <p>Acesse o site pelo computador para gerenciar as sessões.</p>
    </div>
</body>
</html>
