<!DOCTYPE html>
<html lang="pt-BR" id="authHTML">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Fluency — Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <header class="auth-header">
        <div class="logo">
            <span>&lt;</span><span class="innerLogo">Fluency</span><span>/&gt;</span>
        </div>
    </header>

    <main class="auth-layout">
        <section id="auth-elements">
            <div class="ball ball1"></div>
            <div class="ball ball2"></div>
            <div class="ball ball3"></div>
            <h1>Você aprendeu português <span>falando</span></h1>
            <p>Participe de sessões de conversação semanais e fique mais perto da fluência.</p>
            <div class="auth-illustration">
                <i class="fa-solid fa-comments"></i>
            </div>
        </section>

        <section class="auth-modal">
            <div class="auth-content" id="login-content">
                <h2>Entrar</h2>
                <p class="auth-subtitle">Acesse sua conta para continuar</p>
                <form id="login-form" class="auth-form">
                    <div class="form-item">
                        <label for="email">E-mail</label>
                        <input type="email" name="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
                    </div>
                    <div class="form-item">
                        <label for="password">Senha</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="login-btn">Entrar</button>
                </form>
            </div>
        </section>
    </main>

    <div class="loading-gif hidden">
        <div class="circle one"></div>
        <div class="circle two"></div>
        <div class="circle three"></div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/auth-page.js"></script>
</body>
</html>
