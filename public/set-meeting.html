<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle | Temas</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/components/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/themes.page.js"></script>
</head>
<body data-shell="app" data-page="set-meeting">
    <main>
        <!-- Visão 1: grade de temas -->
        <div class="content content--list" id="themes-list-view">
            <div class="page-header page-header--stack">
                <div class="page-header__titles">
                    <h2>Temas</h2>
                    <p>Crie, edite ou exclua os tópicos e perguntas utilizados nas sessões.</p>
                </div>
                <button type="button" id="open-create-theme-btn" class="home-btn home-btn--auto">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> Novo Tema
                </button>
            </div>

            <div class="classes-grid classes-grid--full" id="themes-grid" aria-live="polite">
                <!-- Preenchido por js/pages/themes.page.js -->
            </div>
        </div>

        <!-- Visão 2: editor de tema (criar ou editar) -->
        <div class="content content--editor hidden" id="theme-editor-view">
            <button type="button" class="back-button" id="back-to-themes-btn">
                <i class="fa-solid fa-circle-chevron-left" aria-hidden="true"></i>
                <span>Voltar aos Temas</span>
            </button>

            <div class="page-header page-header--left">
                <h2 id="editor-title">Novo Tema</h2>
                <p id="editor-subtitle">Defina o título do tópico e insira as perguntas condutoras.</p>
            </div>

            <div class="theme-container theme-container--full">
                <label for="topic-input">Título do Tema</label>
                <input type="text" id="topic-input" placeholder="Ex: Technology &amp; Daily Life" autocomplete="off">
            </div>

            <div class="questions-container questions-container--full">
                <div class="questions-header">
                    <p class="questions-header__title" id="questions-title">Perguntas de Apoio</p>
                    <button type="button" id="add-question-button" title="Adicionar pergunta" aria-label="Adicionar pergunta">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="questions-list questions-list--scroll" id="questions-list" role="group" aria-labelledby="questions-title">
                    <!-- Campos de pergunta inseridos por js/pages/themes.page.js -->
                </div>
            </div>

            <div class="editor-actions">
                <button type="button" id="cancel-theme-btn" class="home-btn-secondary home-btn editor-action-btn">Cancelar</button>
                <button type="button" id="editor-delete-theme-btn" class="home-btn danger-btn editor-action-btn hidden">Excluir</button>
                <button type="button" id="set-button" class="home-btn editor-action-btn">Salvar</button>
            </div>
        </div>
    </main>
</body>
</html>
