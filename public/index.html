<!DOCTYPE html>
<html lang="pt-BR" id="home">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <title>Fluency</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo" id="logo">
            <span>&lt;</span><span class="innerLogo">Fluency</span><span>/&gt;</span>
        </div>
        <div class="header-actions">
            <span class="user-email" id="user-email"></span>
            <button id="logout-btn" class="logout-btn" title="Sair">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sair</span>
            </button>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li  data-page="home" data-file="index.html">
                    <a href="#" onclick="backToHome(); return false;">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                    <li data-page="set-meeting" data-file="set-meeting.html">
                        <a href="#" id="open-set-meeting-button">
                            <i class="fa-solid fa-calendar-plus"></i>
                            <span>Criar reunião</span>
                        </a>
                    </li>
                    <li data-page="slide-show" data-file="presentation.html">
                        <a href="#" id="open-slide-show-button">
                            <i class="fa-solid fa-play"></i>
                            <span>Iniciar reunião</span>
                        </a>
                    </li>
                <li data-page="flash-cards" data-file="flash-cards.html">
                    <a href="#" id="open-flash-cards-button">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Flash Cards</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main id="home-page">
        <div class="content home-content">
            <div class="welcome-section">
                <h1>Bem-vindo ao <span class="highlight">Fluency</span></h1>
                <p class="welcome-subtitle">Pratique conversação em inglês com reuniões interativas e flash cards personalizados.</p>
                <div class="home-page-options">
                    <button class="home-btn" id="home-set-meeting">
                        <i class="fa-solid fa-calendar-plus"></i>
                        Criar reunião
                    </button>
                    <button class="home-btn home-btn-secondary" id="home-start-meeting">
                        <i class="fa-solid fa-play"></i>
                        Iniciar reunião
                    </button>
                    <button class="home-btn home-btn-secondary" id="home-flash-cards">
                        <i class="fa-solid fa-layer-group"></i>
                        Flash Cards
                    </button>
                </div>
            </div>
        </div>
    </main>

   

   
 

    <div class="alert hidden">
        <div class="alert-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <p></p>
    </div>

    <div class="loading-gif hidden">
        <div class="circle one"></div>
        <div class="circle two"></div>
        <div class="circle three"></div>
    </div>
    <script type="module" src="js/menu.js"> </script>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
