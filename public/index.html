<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/components/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <!-- Cabeçalho e menu (js/ui/app-shell.js) carregam primeiro: não dependem do Firebase. -->
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/home.page.js"></script>
</head>
<body data-shell="app" data-page="home">
    <main id="home-page">
        <div class="content home-content">
            <div class="welcome-section">
                <h1>Bem-vindo ao <span class="highlight">FluenCircle</span></h1>
                <p class="welcome-subtitle">Você aprendeu português falando</p>

                <!-- Atalhos: "mediator-access" fica oculto para alunos (ver app-shell.js). -->
                <nav class="home-page-options" aria-label="Atalhos">
                    <a class="home-btn" id="home-flash-cards" href="flash-cards.html">
                        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                        Flash Cards
                    </a>
                    <a class="home-btn home-btn-secondary mediator-access hidden" id="home-start-meeting" href="presentation.html">
                        <i class="fa-solid fa-play" aria-hidden="true"></i>
                        Iniciar sessão
                    </a>
                    <a class="home-btn home-btn-secondary mediator-access hidden" id="home-set-meeting" href="set-meeting.html">
                        <i class="fa-solid fa-calendar-plus" aria-hidden="true"></i>
                        Temas
                    </a>
                </nav>
            </div>

            <section class="student-week hidden" id="live-rooms" aria-labelledby="live-rooms-title">
                <div class="student-week__header">
                    <h2 id="live-rooms-title">Círculos ao vivo</h2>
                </div>
                <p id="room-status" role="status"></p>
                <ul id="room-list" class="room-list"></ul>
                <div id="room-view" class="room-view hidden">
                    <button id="leave-room" class="home-btn home-btn-secondary" type="button">Sair da sala</button>
                    <h3 id="room-topic"></h3>
                    <p id="room-slide" aria-live="polite"></p>
                    <section aria-labelledby="room-chat-title">
                        <h4 id="room-chat-title">Chat da sala</h4>
                        <ol id="room-chat" class="room-chat" role="log" aria-labelledby="room-chat-title" tabindex="0"></ol>
                        <form id="room-chat-form" class="room-chat-form">
                            <label for="room-message">Mensagem</label>
                            <input id="room-message" maxlength="500" required autocomplete="off">
                            <button id="send-room-message" class="home-btn home-btn-secondary" type="submit">Enviar</button>
                        </form>
                    </section>
                </div>
            </section>

            <!-- Agenda semanal do participante (PR #2): aparece para quem tem plano. -->
            <section class="student-week hidden" id="student-week" aria-labelledby="student-week-title">
                <div class="student-week__header">
                    <h2 id="student-week-title">Sua semana</h2>
                    <p class="student-week__subtitle" id="student-week-subtitle"></p>
                </div>
                <div class="week-agenda" id="student-agenda" aria-live="polite"></div>
            </section>
        </div>
    </main>
</body>
</html>
