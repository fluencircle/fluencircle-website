<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle | Admin</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/components/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/admin.page.js"></script>
</head>
<body data-shell="app" data-page="admin">
    <main id="admin-page">
        <div class="content content--list">
            <div class="page-header page-header--stack">
                <div class="page-header__titles">
                    <h2>Acessos</h2>
                    <p>Cadastre, modifique papéis, planos e gerencie as contas de acesso da plataforma</p>
                </div>

                <div class="page-header__actions">
                    <button type="button" id="open-create-user-modal-btn" class="home-btn home-btn--auto">
                        <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Novo Perfil
                    </button>

                    <div class="admin-search-container">
                        <div class="admin-search-wrapper">
                            <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                            <input type="text" id="admin-search-bar" placeholder="Pesquisar por nome, e-mail ou plano..." aria-label="Pesquisar usuário por nome, e-mail ou plano" autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>

            <div class="users-table-container">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th scope="col">Nome Completo</th>
                            <th scope="col">E-mail</th>
                            <th scope="col">ID</th>
                            <th scope="col">Acesso</th>
                            <th scope="col">Plano</th>
                            <th scope="col" class="users-table__actions-head">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" aria-live="polite">
                        <!-- Preenchido por js/pages/admin.page.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de cadastro / edição de perfil -->
    <div class="modal-container hidden" id="user-form-modal">
        <div class="modal modal--form" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
            <button type="button" class="close-end-meeting-btn" id="close-user-modal-btn" aria-label="Fechar">
                <i class="fa-solid fa-x" aria-hidden="true"></i>
            </button>
            <div class="modal-content">
                <h3 id="user-modal-title">Novo Perfil</h3>
                <p class="modal-sub-info">Preencha as informações do usuário e defina o nível de acesso.</p>

                <form id="user-form" class="user-form">
                    <div class="form-item">
                        <label for="user-firstname">Nome</label>
                        <input type="text" id="user-firstname" placeholder="Ex: Lucas" required autocomplete="off">
                    </div>

                    <div class="form-item">
                        <label for="user-lastname">Sobrenome</label>
                        <input type="text" id="user-lastname" placeholder="Ex: Ferreira" required autocomplete="off">
                    </div>

                    <div class="form-item">
                        <label for="user-email-input">E-mail</label>
                        <input type="email" id="user-email-input" placeholder="usuario@email.com" required autocomplete="off">
                    </div>

                    <div class="form-item" id="password-field-container">
                        <label for="user-password-input">Senha Inicial</label>
                        <input type="password" id="user-password-input" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password">
                    </div>

                    <div class="form-item">
                        <label for="user-role-select">Função no Sistema</label>
                        <!-- Opções geradas a partir de ROLE_LABELS (js/core/roles.js) -->
                        <select id="user-role-select"></select>
                    </div>

                    <div class="form-item">
                        <label for="user-plan-select">Plano de assinatura</label>
                        <!-- Opções geradas a partir de `plans` (js/pages/admin.page.js) -->
                        <select id="user-plan-select"></select>
                    </div>

                    <div class="flexbox">
                        <button type="button" id="cancel-user-modal-btn" class="secondary-btn">Cancelar</button>
                        <button type="submit" id="save-user-btn" class="home-btn home-btn--auto home-btn--roomy">Salvar Perfil</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
