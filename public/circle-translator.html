<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Circle Tradutor: tradução inglês e português para as sessões presenciais do FluenCircle.">
    <title>Circle Tradutor</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/app.css">
    <!-- Estilos só desta página (antes num bloco <style> inline). -->
    <link rel="stylesheet" href="css/pages/circle-translator.css">
    <script type="module" src="js/pages/circle-translator.page.js"></script>
</head>
<body data-page="translator">
    <header>
        <div class="logo" id="logo" aria-label="FluenCircle">
            <div class="logo-icon">
                <div class="logo-circle-center">
                    <div class="logo-circle-left"></div>
                    <div class="logo-inner-circle"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Um <div>, não <main>: a regra global de `main` (área logada) quebraria este layout. -->
    <div id="translator">
        <div id="session-badge">
            <p id="sessionName" aria-live="polite"></p>
        </div>

        <div id="translator-container">
            <h2 class="translator-title">Circle Tradutor</h2>
        </div>

        <div id="translator-fields">
            <input type="text" id="sourceText" placeholder="Digite uma palavra" aria-label="Palavra ou frase a traduzir" autocomplete="off">
            <input type="text" id="targetText" placeholder="Sua tradução" aria-label="Tradução" readonly>
            <button type="button" id="translateBtn" class="btn-primary">Traduzir</button>
        </div>

        <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
    </div>

    <footer>
        <div id="footer-message">
            <p>Entre no nosso grupo e participe de sessões de conversação gratuitas toda semana!</p>
            <a class="btn-primary join-btn" href="https://wa.me/556696939166?text=%F0%9F%9F%A2Eu%20quero%20participar%20do%20FluenCircle%21" target="_blank" rel="noopener noreferrer">Faça parte!</a>
        </div>
    </footer>
</body>
</html>
