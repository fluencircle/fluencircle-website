<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>
</head>

<style>


    *{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }


    #flashcard-container{
        width: 100vw;
    height:100vh;
    background-color: var(--second-color);
    border-radius: 10px;
    position: absolute;
    top: 0px;
    text-align: center;
    align-items: center;
    cursor: pointer;
    display: flex; 
    background-color:#081a2e;
 
    justify-content: center;
    
 html, body{
   margin: 0px;
   background-color:#081a2e;
   padding: 0px;
 }
   


        
    }
    .card{
        height: 400px;        
        width: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 30px;
        border: 1px solid rgba(141, 140, 140, 0.432);
        position: absolute;

         transition: transform 0.7s ease;
    transform-style: preserve-3d; 
        cursor: pointer;box-shadow: 0px 0px 10px 1px rgba(0, 0, 0, 0.158);
    }


    .returned{
        animation: cardReturn 1s forwards
    }

    .card-back, .card-front{
        position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 30px;
 
    backface-visibility: hidden; 
    display: flex;
    align-items: center;
    justify-content: center;
    }


    .card-back{
        color: var(--primary-color);
        background-color: #c3c5ca;
    transform: rotateY(180deg);
    }

    .card-front{
        background-color: #c3c5ca;
    }


    
    .card.flipped{
        transform: rotateY(180deg);
    }


    

    @keyframes unhide{
        from{
            backface-visibility: hidden;
        }
        to{
            backface-visibility: visible;
        }
    }






    .removed-card{
       animation: removeCard 1s forwards;
    }





    @keyframes removeCard{
        0%{
            transform: none;
            opacity: 1;
        }
  
        100%{
            transform: rotate(45deg) translateX(100px) translateY(100px);
            opacity: 0;
        }
        
    }

    @keyframes cardReturn{
        0%{
             transform: rotate(45deg) translateX(100px) translateY(100px);
            opacity: 0; 
        }
        100%{
           transform: none;opacity: 1;
        }
    }


    @keyframes cardTurn{
        0%{
            transform: none;
       
        }
  
        100%{
            transform: rotateY(180deg);
  
        }
        
    }

    .btn-next {
    position: absolute;
    bottom: 12px;
    right: 12px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #4f46e5;
    background-color: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
}

/* Efeito ao passar o mouse */
.btn-next:hover {
    background-color: #4f46e5;
    color: #ffffff;
    border-color: #4f46e5;
    transform: translateY(-1px);
}

    


</style>
<body>

    <button id="previousCard" style="position: absolute; z-index: 1000; width: 200px; height: 50px;";></button>
 
        <!-- Card 1 -->
        <div id="flashcard-container">
            <!-- Card 1 -->
            <div id="card-one" data-position="1" class="card" data-questionNumber = "1">
                <div class="card-front">
                    Frente 1 (Pergunta)
                </div>
                <div class="card-back">
                    <button class="btn-next">Next</button>
                    Verso 1 (Resposta)
                </div>
            </div>
        
            <!-- Card 2 -->
            <div id="card-two" data-position="2" class="card">
                <div class="card-front">
                    Frente 2 (Pergunta)
                </div>
                <div class="card-back">
                    <button class="btn-next">Next</button>
                    Verso 2 (Resposta)
                </div>
            </div>
        
            <!-- Card 3 -->
            <div id="card-three" data-position="3" class="card">
                <div class="card-front">
    
                    Frente 3 (Pergunta)
                </div>
                <div class="card-back">
                    <button class="btn-next">Next</button>
                    Verso 3 (Resposta)
                </div>
            </div>
        
            <!-- Card 4 -->
            <div id="card-four" data-position="4" class="card">
                <div class="card-front">
                    Frente 4 (Pergunta)
                </div>
                <div class="card-back">
                    <button class="btn-next">Next</button>
                    Verso 4 (Resposta)
                </div>
            </div>
        
            <!-- Card 5 -->
            <div id="card-five" data-position="5" class="card">
                <div class="card-front">

                    
    
                    Frente 5 (Pergunta)
                </div>
                <div class="card-back">
                    <button class="btn-next">Next</button>
                    Verso 5 (Resposta)
                </div>
            </div>
        </div>
    


    </div>
</body>



<script>
const flashcards = Array.from(document.getElementById('flashcard-container').children)



updateCardPositions()


function updateCardPositions(backward){
    flashcards.forEach(card =>{

        if(backward == true){
            card.dataset.position = parseInt(card.dataset.position) + 1
        }else{
card.dataset.position = parseInt(card.dataset.position) - 1
        }
    

    const number = card.dataset.position
    

    card.style.marginBottom = (number * 40) + 'px';
    card.style.opacity = (1 - number/10)
    card.style.zIndex = 10-number

    if(number != 0){card.style.pointerEvents = 'none'}else{card.style.pointerEvents = 'all'}

    card.querySelector('.btn-next').onclick = () =>{

    card.classList.add('removed-card')
    updateCardPositions(false)
}


card.onclick = () =>{
        card.classList.toggle('flipped')
}


card.onanimationend = (e) =>{
    console.log('end')
                if (e.animationName == 'cardReturn'){
                    card.classList.remove('returned')
                }
            }


const previousCardBtn = document.getElementById('previousCard')

previousCardBtn.onclick = () =>{


   const isFirst =  flashcards.reduce((acc, card) =>{
        const position = card.dataset.position;
        const questionNumber = card.dataset.questionnumber;


if (position === '0' && questionNumber === '1') {
            return true;
        }
        return acc; 
    }, false);

    console.log(isFirst)

    if (isFirst){return}

    flashcards.forEach(card=>{

            if(card.dataset.position == '0' ){
                console.log('!!')
            }

        if (card.dataset.position == '-1'){
            card.classList.remove('removed-card')
            card.classList.add('returned')
        }
    })
    updateCardPositions(true)
}
})
}




</script>
</html>
