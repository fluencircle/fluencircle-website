<!DOCTYPE html>
<html lang="pt-BR" id="slide-show">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <title>Fluency</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo" id="logo">
            <span>&lt;</span><span class="innerLogo">Fluency</span><span>/&gt;</span>
        </div>
        <div class="header-actions">
            <span class="user-email" id="user-email"></span>
            <button id="logout-btn" class="logout-btn" title="Sair">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sair</span>
            </button>
        </div>
    </header>
 

    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li  data-page="home" data-file="index.html">
                    <a href="#" onclick="backToHome(); return false;">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li data-page="set-meeting" data-file="set-meeting.html">
                    <a href="#" id="open-set-meeting-button">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Criar reunião</span>
                    </a>
                </li>
                <li data-page="slide-show" data-file="presentation.html">
                    <a href="#" id="open-slide-show-button">
                        <i class="fa-solid fa-play"></i>
                        <span>Iniciar reunião</span>
                    </a>
                </li>
                <li data-page="flash-cards" data-file="flash-cards.html">
                    <a href="#" id="open-flash-cards-button">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Flash Cards</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>



<main id="slide-show-page" >
    <div class="content select-content">
        <div class="page-header">
            <h2>Iniciar reunião</h2>
            <p>Selecione uma apresentação para começar</p>
        </div>

        <div id="presentation-select">   
            <div class="loading-gif presentation-gif hidden">
        <div class="circle one"></div>
        <div class="circle two"></div>
        <div class="circle three"></div>
    </div>
            <p id="value">Selecione uma reunião</p>
          <div id="option-list" class="hidden">
                <div class="meeting-option"></div>
            </div><i class="fa-solid fa-caret-down"></i>
        </div>
        
        <button id="start-presentation-btn" class="unclickable">Iniciar</button>
    </div>
    <div class="content slide-content hidden">
        <div class="back-to-selection back-button">
            <i class="fa-solid fa-circle-chevron-left"></i>
            <span>Voltar</span>
        </div>
        <div class="slide">

        </div>
    </div>
</main>

<div class="translation-button">
    <i class="fa-solid fa-language"></i>
    <span>Tradutor</span>
</div>

<div class="modal-container hidden" id="translator-modal">
    <div class="modal">
        <button class="close-translation-btn"><i class="fa-solid fa-x"></i></button>
        <div class="modal-content" id="translation-content">
            <h3>Tradutor rápido</h3>
            <p>Selecione o idioma e traduza em tempo real</p>
            <div class="select-container">
                <select id="translation-options">
                    <option value="pt">Português → Inglês</option>
                    <option value="en">Inglês → Português</option>
                </select>
            </div>
            <div class="translation-container">
                <input type="text" id="normal-text" placeholder="Digite um texto" autocomplete="off">
                <input type="text" id="translated-text" placeholder="Tradução aparecerá aqui" readonly>
            </div>
            <div class="flexbox">
                <button id="translate-btn">Traduzir</button>
                <button id="add-flashcards-btn" class="unactive">Adicionar ao Flash Card</button>
            </div>
        </div>
        <div class="modal-content hidden" id="add-flashcard-content">
            <h3>Adicionar Flash Card</h3>
            <p>Selecione a reunião para salvar o card</p>
            <div class="select-container">
                <select id="select-meeting"></select>
            </div>
            <div class="flexbox">
                <button id="save-flashcard-btn">Salvar</button>
            </div>
        </div>
    </div>
</div>

<div class="alert hidden">
    <div class="alert-icon">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <p></p>
</div>


<script type="module" src="js/menu.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/presentation.js"></script>

</body>
