<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluenCircle | Conversação</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/components/icons.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/ui/app-shell.js"></script>
    <script type="module" src="js/pages/presentation/presentation.page.js"></script>
</head>
<body data-shell="app" data-page="slide-show">
    <main id="slide-show-page">
        <!-- Tela 1: escolha do tema e início da sessão -->
        <div class="content select-content hide-on-mobile">
            <div class="page-header">
                <h2>Iniciar Sessão de Conversação</h2>
                <p>Escolha o tema base para abrir um novo evento de sessão</p>
            </div>

            <div id="presentation-select" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-label="Escolher tema">
                <div class="presentation-select__inner">
                    <div class="loading-gif hidden" id="themes-loader" role="status" aria-label="Carregando temas">
                        <div class="circle one"></div>
                        <div class="circle two"></div>
                        <div class="circle three"></div>
                    </div>
                    <p id="value">Selecione um tema</p>
                    <div id="option-list" class="hidden" role="listbox" aria-label="Temas"></div>
                    <i class="fa-solid fa-caret-down" aria-hidden="true"></i>
                </div>
            </div>

            <label class="hidden" id="public-translator-option">
                <input type="checkbox" id="share-public-translator" checked>
                Publicar no tradutor público
            </label>
            <button type="button" id="start-presentation-btn" class="unclickable" aria-disabled="true">Iniciar</button>
        </div>

        <!-- Tela 2: slides da sessão em andamento (js/pages/presentation/slides.js) -->
        <div class="content slide-content hidden">
            <div class="meeting-status-bar">
                <button type="button" class="back-to-selection back-button" id="end-meeting-btn">
                    <span>Encerrar</span>
                </button>
                <!-- Situação da publicação no tradutor público (posse da sessão ativa) -->
                <p id="presentation-status" class="presentation-status" role="status" aria-live="polite"></p>
                <a id="open-live-room" class="hidden" href="index.html" target="_blank" rel="noopener">Abrir sala e chat</a>
            </div>

            <div class="slide" aria-live="polite"></div>
        </div>
    </main>

    <!-- Botões flutuantes, visíveis só durante a sessão -->
    <button type="button" class="translation-button hidden" id="open-translator-btn">
        <i class="fa-solid fa-language" aria-hidden="true"></i>
        <span>Tradutor</span>
    </button>

    <button type="button" class="attendance-toggle-btn hidden" id="open-attendance-btn">
        <i class="fa-solid fa-people-group" aria-hidden="true"></i>
        <span>Participantes</span>
        <span class="attendance-count-badge" id="attendance-count-badge">0</span>
    </button>

    <!-- Tradutor (js/pages/presentation/translator-modal.js) -->
    <div class="modal-container hidden" id="translator-modal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="translator-title">
            <button type="button" class="close-translation-btn" id="close-translator-btn" aria-label="Fechar tradutor">
                <i class="fa-solid fa-x" aria-hidden="true"></i>
            </button>

            <div class="modal-content" id="translation-content">
                <h3 id="translator-title">Tradutor</h3>

                <div class="translation-container">
                    <input type="text" id="normal-text" placeholder="Digite algo em inglês ou português" aria-label="Texto a traduzir" autocomplete="off">
                    <input type="text" id="translated-text" placeholder="A tradução aparecerá aqui..." aria-label="Tradução" readonly>
                </div>

                <div class="flexbox">
                    <button type="button" id="translate-btn">Traduzir</button>
                    <button type="button" id="add-flashcards-btn" class="unactive" aria-disabled="true">Salvar Flashcard</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista de presença (js/pages/presentation/attendance.js) -->
    <aside class="attendance-drawer hidden" id="attendance-drawer" aria-label="Participantes da sessão">
        <div class="attendance-drawer-header">
            <div class="attendance-drawer-title">
                <i class="fa-solid fa-people-group attendance-drawer-title__icon" aria-hidden="true"></i>
                <h3>Participantes</h3>
            </div>
            <button type="button" class="close-drawer-btn" id="close-attendance-btn" aria-label="Fechar lista de participantes">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>

        <div class="custom-student-select-container">
            <div class="custom-select-trigger" id="student-select-trigger">
                <input type="text" placeholder="Adicionar participante..." id="attendance-search-bar" aria-label="Buscar aluno para adicionar" aria-expanded="false" aria-controls="student-options-list" autocomplete="off">
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </div>
            <div class="custom-select-options-list hidden" id="student-options-list" role="listbox"></div>
        </div>

        <div class="attendees-list-section">
            <div class="attendees-list" id="attendees-list">
                <p class="empty-state empty-state--compact">Nenhum aluno adicionado ainda.</p>
            </div>
        </div>
    </aside>

    <div class="not-available-message">
        <h2>Não disponível</h2>
        <p>Acesse o site pelo computador para iniciar uma sessão.</p>
    </div>
</body>
</html>
